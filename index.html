    if (!cycleOn) {
      eventBlocks.forEach(function (b) {
        if (conflictOf(b.evRef)) { b.ring = 'inset 0 0 0 1.5px #C0492F'; b.alertShow = 'flex'; }
      });
    }

    // ── créneaux libres > 20 min ──
    var busy = bandList.map(function (b) { return { s: b.a, e: b.b }; })
      .concat(allEvents.map(function (e) { return { s: e.s, e: e.e }; }))
      .sort(function (a, b) { return a.s - b.s; });
    var merged = [];
    busy.forEach(function (x) {
      var last = merged[merged.length - 1];
      if (last && x.s <= last.e) last.e = Math.max(last.e, x.e);
      else merged.push({ s: x.s, e: x.e });
    });
    var gaps = [];
    var cursor = 0;
    merged.forEach(function (b) {
      if (b.s - cursor >= 20) gaps.push({ s: cursor, e: b.s });
      cursor = Math.max(cursor, b.e);
    });
    if (1440 - cursor >= 20) gaps.push({ s: cursor, e: 1440 });

    // une seule suggestion par type, priorisée par les habitudes non faites du jour
    var undoneHabits = this.HAB.filter(function (h) { return !st.hd[h.id]; });
    var wanted = {};
    undoneHabits.forEach(function (h) {
      var s = self.HABIT_SUGGEST[h.id];
      if (s) wanted[s.k] = { name: s.name, title: s.title, habit: h.name, streak: h.streak };
    });
    var alreadyPlanned = function (nm) {
      return allEvents.some(function (e) { return e.name.toLowerCase() === nm.toLowerCase(); });
    };

    var seen = {}, gapCards = [];
    gaps.forEach(function (g) {
      var pick = null;
      for (var i = 0; i < self.GAP_SUGGEST.length; i++) {
        var s = self.GAP_SUGGEST[i];
        if (g.s >= s.from && g.s < s.to) pick = s;
      }
      if (!pick) return;
      if (seen[pick.id]) return;
      var key = dayKey + '|' + pick.id;
      if (st.gapsOff[key]) { seen[pick.id] = true; return; }
      var w = wanted[pick.k];
      var name = w ? w.name : pick.name;
      if (alreadyPlanned(name)) { seen[pick.id] = true; return; }
      seen[pick.id] = true;
      var mins = g.e - g.s;
      var dur = Math.min(mins, Math.max(pick.min, Math.min(45, mins)));
      var a = ACT[pick.k];
      gapCards.push({
        key: key, prio: w ? 0 : 1,
        slot: self.hhmm(g.s) + ' – ' + self.hhmm(g.e) + ' · ' + mins + ' min',
        name: name, title: w ? w.title : pick.title,
        reasonShow: w ? 'block' : 'none',
        reason: w ? 'Ton habitude « ' + w.habit + ' » n\'est pas encore faite · série de ' + w.streak + ' j' : '',
        hadith: '« ' + pick.hadith + ' »', src: pick.src,
        d: self.IC[a.ic][0], d2: self.IC[a.ic][1],
        add: function () {
          self.addEvent(dayKey, { id: Date.now(), name: name, s: g.s, e: g.s + dur, cat: a.cat, ic: a.ic });
          var off = Object.assign({}, st.gapsOff); off[key] = true;
          self.setState({ gapsOff: off });
          self.toast(name + ' · ' + self.hhmm(g.s) + ' → ' + self.hhmm(g.s + dur));
        },
        skip: function () { var off = Object.assign({}, st.gapsOff); off[key] = true; self.setState({ gapsOff: off }); }
      });
    });
    gapCards.sort(function (a, b) { return a.prio - b.prio; });

    // ── bilan de fin de journée ──
    var undone = sortedEvents.filter(function (e) { return !st.done[e.key]; });
    var reviewDone = sortedEvents.length - undone.length;
    var groupPrayers = 0;
    Object.keys(st.ps).forEach(function (k) { if (st.ps[k] === 'group') groupPrayers++; });
    var reviewRows = sortedEvents.map(function (e) {
      var d = !!st.done[e.key];
      var t = self.tint(e.cat);
      return {
        name: e.name, time: self.hhmm(e.s),
        bg: d ? '#E6F1EB' : '#F7E4DE', ink: d ? '#0B6349' : '#A33D25',
        mark: d ? 'M5 13l4 4L19 7' : 'M6 6l12 12M18 6L6 18',
        nameInk: d ? '#8A8578' : '#1A1610', deco: d ? 'line-through' : 'none'
      };
    });

    // ── vue chronologie ──
    var tlItems = [];
    var tlMix = sortedEvents.map(function (e) { return { kind: 'ev', s: e.s, e: e.e, o: e }; })
      .concat(bandList.map(function (b) { return { kind: 'pr', s: b.a, e: b.b, o: b }; }))
      .sort(function (a, b) { return a.s - b.s; });
    tlMix.forEach(function (x) {
      if (x.kind === 'pr') {
        var s = STY[st.ps[x.o.n]] || STY.pending;
        tlItems.push({
          time: self.hhmm(x.o.a), name: x.o.n, meta: 'Plage réservée · ' + (x.o.b - x.o.a) + ' min',
          bg: '#E6F1EB', ink: '#0B6349', bar: '#0E7C5A', d: self.IC.mosquee[0], d2: self.IC.mosquee[1],
          badge: s.deco === 'line-through' ? 'Manquée' : (st.ps[x.o.n] === 'group' ? 'En groupe' : ''),
          open: function () { self.cycle(x.o.n); }
        });
      } else {
        var e = x.o, t = self.tint(e.cat), d = !!st.done[e.key];
        var mn = e.e - e.s;
        tlItems.push({
          time: self.hhmm(e.s), name: e.name,
          meta: e.catLabel + ' · ' + (mn >= 60 ? (mn % 60 === 0 ? mn / 60 + 'h' : Math.floor(mn / 60) + 'h' + (mn % 60)) : mn + ' min'),
          bg: t.bg, ink: t.ink, bar: t.bar, d: self.IC[e.ic][0], d2: self.IC[e.ic][1],
          badge: d ? 'Fait' : (conflictOf(e) ? 'Conflit prière' : ''),
          open: function () { self.setState({ detail: { dk: dayKey, id: e.id } }); }
        });
      }
    });

    // ── recherche mosquée (Mawaqit) ──
    var mqq = (st.mq || '').trim().toLowerCase();
    var mosqueHits = this.MOSQUES.filter(function (m) {
      if (!mqq) return true;
      return (m.name + ' ' + m.city).toLowerCase().indexOf(mqq) !== -1;
    }).map(function (m) {
      var on = m.id === st.mosque;
      return {
        name: m.name, city: m.city, dist: m.dist,
        fajr: self.hhmm(m.times[0].m), isha: self.hhmm(m.times[4].m),
        bg: on ? '#E6F1EB' : '#FFFFFF', border: on ? '#0E7C5A' : '#E4E1D8',
        checkShow: on ? 'flex' : 'none',
        pick: function () { self.setState({ mosque: m.id, modal: '' }); self.toast(m.name + ' · horaires synchronisés'); }
      };
    });

    // ── calques enfants ──
    var kidsActive = st.kidsOn;
    var kidChips = this.KIDS.map(function (k) {
      var on = kidsActive && st.kidsShown[k.id];
      return {
        name: k.name, initial: k.initial, color: k.color,
        bg: on ? k.color : '#FFFFFF', ink: on ? '#FFFFFF' : '#8A8578',
        border: on ? k.color : '#E4E1D8',
        toggle: function () {
          var s = Object.assign({}, st.kidsShown); s[k.id] = !s[k.id];
          self.setState({ kidsShown: s, kidsOn: true });
        }
      };
    });
    var kidLanes = kidsActive ? this.KIDS.filter(function (k) { return st.kidsShown[k.id]; }).map(function (k) {
      return {
        initial: k.initial, color: k.color,
        blocks: k.blocks.map(function (b) {
          return {
            name: b.name, top: self.px(b.s), h: ((b.e - b.s) / 60 * self.HH).toFixed(1) + 'px',
            range: self.hhmm(b.s) + ' – ' + self.hhmm(b.e),
            open: function () { self.toast(k.name + ' · ' + b.name + ' · ' + self.hhmm(b.s) + ' → ' + self.hhmm(b.e)); }
          };
        })
      };
    }) : [];

    var kidMemo = this.KIDS.map(function (k) {
      var done = st.memo[k.id];
      return {
        name: k.name, initial: k.initial, color: k.color, surah: k.surah,
        age: k.age + ' ans', label: done + ' / ' + k.total + ' versets',
        pct: Math.round(done / k.total * 100) + '%',
        validate: function () {
          if (done >= k.total) { self.toast(k.name + ' a terminé ' + k.surah); return; }
          var m = Object.assign({}, st.memo); m[k.id] = done + 1;
          self.setState({ memo: m });
          self.toast(k.name + ' · verset ' + (done + 1) + ' validé');
        }
      };
    });

    // ── mode femme : cycle, tâches, charge ──
    var cyc = st.cycle;
    var cycleDay = cycD;

    if (cycleOn) {
      prayerBands.forEach(function (b) {
        b.bg = '#F5E5EE'; b.border = '#E6CFDC'; b.ink = '#98527A'; b.status = 'Dérogation';
      });
    }

    var busyMin = merged.reduce(function (a, b) { return a + (b.e - b.s); }, 0);
    var wakeMin = 1440 - 420;
    var loadPct = Math.min(100, Math.round(busyMin / wakeMin * 100));
    var loadLevel = loadPct >= 85 ? 'high' : (loadPct >= 65 ? 'mid' : 'ok');
    var LOAD = {
      ok: { bg: '#E6F1EB', border: '#CBE3D6', ink: '#0B6349', bar: '#0E7C5A', title: 'Journée équilibrée', sub: 'Il te reste de la marge pour l\'imprévu.' },
      mid: { bg: '#F7EFDD', border: '#EADFC4', ink: '#8A5E1F', bar: '#B08D4F', title: 'Journée chargée', sub: 'Garde une respiration entre deux blocs.' },
      high: { bg: '#F7E4DE', border: '#EDCEC5', ink: '#A33D25', bar: '#C0492F', title: 'Journée surchargée', sub: 'Allège : reporte un bloc non essentiel à demain.' }
    };
    var load = LOAD[loadLevel];

    // ── rapport hebdomadaire (vendredi) ──
    var wkKeys = this.weekKeys(dayKey);
    var catTotals = {};
    var wkDone = 0, wkAll = 0;
    wkKeys.forEach(function (k) {
      (st.events[k] || []).forEach(function (e) {
        wkAll++;
        if (st.done[k + '|' + e.id]) wkDone++;
        catTotals[e.cat] = (catTotals[e.cat] || 0) + (e.e - e.s);
      });
    });
    var maxCat = 1;
    Object.keys(catTotals).forEach(function (k) { if (catTotals[k] > maxCat) maxCat = catTotals[k]; });
    var weekRows = Object.keys(catTotals).sort(function (a, b) { return catTotals[b] - catTotals[a]; }).map(function (k) {
      var t = self.tint(k), m = CM[k] || { label: k };
      var mins = catTotals[k];
      return {
        label: m.label, bar: t.bar,
        val: mins >= 60 ? (mins % 60 === 0 ? mins / 60 + 'h' : Math.floor(mins / 60) + 'h' + (mins % 60)) : mins + ' min',
        pct: Math.round(mins / maxCat * 100) + '%'
      };
    });
    var weekSacrificed = ['coran', 'sciences', 'sport', 'arabe'].filter(function (k) { return !catTotals[k]; })
      .map(function (k) { return (CM[k] || { label: k }).label; });

    // ── modale : plages de prière ──
    var bufFields = this.BUF_FIELDS.map(function (f) {
      return {
        label: f.label, sub: f.sub, val: st.buf[f.k], max: f.max,
        valLabel: st.buf[f.k] + ' min',
        d: self.IC[f.ic][0], d2: self.IC[f.ic][1],
        set: function (e) {
          var b = Object.assign({}, st.buf);
          b[f.k] = parseInt(e.target.value, 10);
          self.setState({ buf: b });
        }
      };
    });

    // ── modale : semaine type ──
    var wtTotal = 0;
    var wtDays = this.WEEK_DAYS.map(function (name, di) {
      var acts = st.wt[di] || [];
      wtTotal += acts.length;
      return {
        name: name, isToday: di === 4,
        dotBg: di === 4 ? '#0E7C5A' : '#C9C4B4',
        acts: acts.map(function (a, ai) {
          return {
            time: self.hhmm(a.time), name: a.name,
            remove: function () {
              var wt = Object.assign({}, st.wt);
              wt[di] = acts.filter(function (x, i) { return i !== ai; });
              self.setState({ wt: wt });
            }
          };
        }),
        add: function () {
          var wt = Object.assign({}, st.wt);
          wt[di] = acts.concat([{ time: 1200, dur: 60, name: 'Nouvelle activité', cat: 'sciences' }]);
          self.setState({ wt: wt });
        }
      };
    });

    // ── modale : nouveau bloc ──
    var times = [];
    for (var tm = 0; tm <= 1425; tm += 15) times.push({ v: tm, label: this.hhmm(tm) });
    var nbDur = st.nb.end - st.nb.start;
    var nbDurLabel = nbDur <= 0 ? '—' : (nbDur >= 60 ? (nbDur % 60 === 0 ? Math.floor(nbDur / 60) + 'h' : Math.floor(nbDur / 60) + 'h' + (nbDur % 60)) : nbDur + ' min');
    var nbOwners = [{ id: 'me', name: 'Moi', initial: 'T', color: '#0E7C5A' }].concat(
      this.KIDS.map(function (k) { return { id: k.id, name: k.name, initial: k.initial, color: k.color }; })
    ).map(function (o) {
      var on = (st.nb.owner || 'me') === o.id;
      return {
        name: o.name, initial: o.initial, color: o.color,
        bg: on ? o.color : '#FFFFFF', border: on ? o.color : '#E4E1D8',
        ink: on ? '#FFFFFF' : '#4F4B40',
        avBg: on ? 'rgba(255,255,255,.25)' : o.color,
        pick: function () { self.setState({ nb: Object.assign({}, st.nb, { owner: o.id }) }); }
      };
    });
    var ownerIsKid = (st.nb.owner || 'me') !== 'me';
    var ownerKid = null;
    this.KIDS.forEach(function (k) { if (k.id === st.nb.owner) ownerKid = k; });

    var nbAct = ACT[st.nb.act] || this.ACTIONS[0];
    var nbActions = this.ACTIONS.map(function (a) {
      var on = st.nb.act === a.k;
      var t = self.tint(a.cat);
      return {
        label: a.label, d: self.IC[a.ic][0], d2: self.IC[a.ic][1],
        bg: on ? t.bar : t.bg, ink: on ? '#FFFFFF' : t.ink,
        border: on ? t.bar : '#E4E1D8',
        labelInk: on ? t.ink : '#8A8578',
        pick: function () {
          self.setState({
            nb: Object.assign({}, st.nb, {
              act: a.k, ic: a.ic, cat: a.cat,
              name: (st.nb.name || '').trim() === '' || st.nb.autoName ? a.label : st.nb.name,
              autoName: (st.nb.name || '').trim() === '' || st.nb.autoName,
              end: Math.min(1440, st.nb.start + a.dur)
            })
          });
        }
      };
    });
    var nbRecs = [{ k: 'once', l: 'Une fois' }, { k: 'daily', l: 'Tous les jours' }, { k: 'weekly', l: 'Hebdo' }].map(function (r) {
      var on = st.nb.rec === r.k;
      return {
        label: r.l, bg: on ? '#1A1610' : '#FFFFFF', ink: on ? '#FFFFFF' : '#4F4B40',
        border: on ? '#1A1610' : '#E4E1D8',
        pick: function () { self.setState({ nb: Object.assign({}, st.nb, { rec: r.k }) }); }
      };
    });

    // ── nav ──
    var NAVS = [
      { key: 'today', label: "Aujourd'hui", ic: 'home' },
      { key: 'agenda', label: 'Agenda', ic: 'cal' },
      { key: 'learn', label: 'Apprendre', ic: 'grad' },
      { key: 'groupes', label: 'Groupes', ic: 'users' },
      { key: 'assistant', label: 'Assistant', ic: 'star' }
    ];
    var nav = NAVS.map(function (n) {
      var on = screen === n.key;
      return {
        label: n.label, d: self.IC[n.ic][0], d2: self.IC[n.ic][1],
        pill: on ? '#E6F1EB' : 'transparent', ink: on ? '#075E45' : '#A8A399',
        go: function () { self.setState({ screen: n.key, groupId: null, course: null, modal: '', gmodal: '' }); }
      };
    });

    return {
      isToday: screen === 'today', isAgenda: screen === 'agenda',
      isHabits: screen === 'habitudes', isMushaf: screen === 'mushaf',
      isLearn: screen === 'learn' && !st.course, isAssistant: screen === 'assistant',
      isGroupsList: screen === 'groupes' && !st.groupId,
      isGroupDetail: screen === 'groupes' && !!st.groupId,
      showTools: this.props.showTools !== false,

      dataOpen: st.modal === 'data',
      openData: function () { self.setState({ modal: 'data' }); },
      dataGroups: [
        { title: 'Parcours de science', pct: learnPctNum + '%', bar: '#0E7C5A',
          caption: totalDone + ' / ' + totalAll + ' leçons · Niveau 1 en cours',
          rows: [
            { label: 'Leçons faites', val: String(totalDone) },
            { label: 'Temps étudié', val: '12h 18' },
            { label: 'Modules en cours', val: '3' },
            { label: 'Badges obtenus', val: '3 / 8' }
          ] },
        { title: 'Coran', pct: '62%', bar: '#B08D4F',
          caption: 'Lecture régulière depuis 23 jours',
          rows: [
            { label: 'Pages lues aujourd\'hui', val: String(st.pagesToday) },
            { label: 'Série de lecture', val: '23 j' },
            { label: 'Versets mémorisés en famille', val: String(st.memo.k1 + st.memo.k2) }
          ] },
        { title: 'Prières et discipline', pct: Math.round(groupCount / 5 * 100) + '%', bar: '#0F8A7E',
          caption: 'Sur la journée en cours',
          rows: [
            { label: 'Prières en groupe', val: groupCount + ' / 5' },
            { label: 'Habitudes faites', val: habitsDone + ' / 6' },
            { label: 'Niveau · expérience', val: 'Niv. ' + st.lvl },
            { label: 'Pièces', val: String(st.coins) }
          ] }
      ],
      learnSubtitle: totalDone + ' / ' + totalAll + ' leçons · ' + learnPctNum + '% du parcours',
      programs: programs, levels: levels, badges: badges,
      resumeTitle: prog.resume.title, resumeSub: prog.resume.sub,
      resumeCourse: function () {
        var target = prog.levels[0].modules[0].name;
        self.setState({ course: target, ctab: 'audio', noteDraft: st.cnotes[target] || '' });
      },

      mini: mini, miniShow: !!mini,
      plFull: plFull, playerFullShow: !!plFull,
      cs: cs, isCourse: !!cs,

      groups: groups, gd: gd,
      closeGroup: function () { self.setState({ groupId: null, gmodal: '', attach: false }); },
      createGroup: function () { self.toast('Créer un groupe — formulaire à venir'); },
      joinGroup: function () { self.setState({ gmodal: 'join' }); },
      isInviteModal: st.gmodal === 'invite',
      isJoinModal: st.gmodal === 'join',
      isGroupSettings: st.gmodal === 'settings',
      closeGModal: function () { self.setState({ gmodal: '' }); },
      joinCode: st.joinCode || '',
      setJoinCode: function (e) { self.setState({ joinCode: e.target.value }); },
      submitJoin: function () {
        var v = (st.joinCode || '').trim();
        if (!v) { self.toast('Colle le lien ou le code reçu'); return; }
        self.setState({ gmodal: '', joinCode: '' });
        self.toast('Demande envoyée au responsable du groupe');
      },

      aiModes: aiModes, aiResults: aiResults, aiChips: aiChips,
      aiQuery: st.aiQuery,
      setAiQuery: function (e) { self.setState({ aiQuery: e.target.value }); },
      aiEmpty: matches.length === 0,
      aiCountLabel: matches.length + (matches.length > 1 ? ' résultats' : ' résultat'),
      aiMatchLabel: q ? 'pour « ' + st.aiQuery.trim() + ' »' : 'les plus consultés',

      nextName: next.n, nextTime: this.hhmm(next.m),
      nextIn: (nh > 0 ? nh + 'h ' : '') + nm + ' min',
      nextStart: this.hhmm(next.m - bBefore), nextEnd: this.hhmm(next.m + bAfter),
      nextSpan: bBefore + bAfter,

      prayerCells: prayerCells, stats: stats, blocks: blocks, doneCount: doneCount,
      objectives: objectives, tools: tools, fastNote: fastNote,

      hours: hours, gridH: (24 * this.HH) + 'px', prayerBands: prayerBands,
      eventBlocks: eventBlocks, nowTop: this.px(this.NOW),
      nowShow: st.cur === this.TODAY_KEY ? 'block' : 'none',
      views: views, weekStrip: weekStrip,
      emptyCells: emptyCells,

      gridRef: function (el) {
        if (el && self._grid !== el) { self._grid = el; self.frameGrid(); }
        else if (!el) self._grid = null;
      },
      isDayView: st.view === 'day', isMultiView: st.view === 'three' || st.view === 'week',
      isMonthView: st.view === 'month',
      dayCols: dayCols, hours2: hours2, gridH2: (24 * HH2) + 'px',
      monthCells: monthCells, monthDows: this.DOWS_S,
      agendaTitle: st.view === 'month' ? this.monthLabel(st.cur) : this.dayLabel(st.cur),
      agendaSub: st.view === 'month' ? ((st.events[st.cur] || []).length + ' blocs le ' + this.pd(st.cur).getDate()) : this.monthLabel(st.cur),
      prevPeriod: function () {
        var n = st.view === 'week' ? -7 : (st.view === 'three' ? -3 : -1);
        if (st.view === 'month') { var d = self.pd(st.cur); d.setMonth(d.getMonth() - 1); self.setState({ cur: self.dk(d), detail: null }); return; }
        self.setState({ cur: self.addDays(st.cur, n), detail: null });
      },
      nextPeriod: function () {
        var n = st.view === 'week' ? 7 : (st.view === 'three' ? 3 : 1);
        if (st.view === 'month') { var d = self.pd(st.cur); d.setMonth(d.getMonth() + 1); self.setState({ cur: self.dk(d), detail: null }); return; }
        self.setState({ cur: self.addDays(st.cur, n), detail: null });
      },
      backToToday: function () { self.setState({ cur: self.TODAY_KEY, detail: null }); },
      isOnToday: st.cur === this.TODAY_KEY,

      detail: det, detailOpen: !!det,
      closeDetail: function () { self.setState({ detail: null }); },

      conflictCount: conflicts.length,
      conflictShow: conflicts.length && st.view === 'day' && !cycleOn ? 'flex' : 'none',
      conflictLabel: conflicts.length > 1 ? conflicts.length + ' blocs empiètent sur une prière' : 'Un bloc empiète sur une prière',
      fixFirstConflict: function () {
        if (!conflicts.length) return;
        self.setState({ detail: { dk: dayKey, id: conflicts[0].id } });
      },

      gapCards: gapCards,
      gapCount: gapCards.length,
      gapsBtnShow: gapCards.length && st.view === 'day' ? 'flex' : 'none',
      gapsLabel: gapCards.length > 1 ? gapCards.length + ' suggestions pour tes trous' : 'Une suggestion pour ton trou',
      gapsSub: gapCards.length ? 'Basées sur tes habitudes non faites' : '',
      openGaps: function () { self.setState({ modal: 'gaps' }); },
      isGapsModal: st.modal === 'gaps',

      laneOffset: kidLanes.length ? (kidLanes.length * 30 + 8) + 'px' : '4px',
      laneW: (kidLanes.length * 30) + 'px',
      kidsSectionShow: st.kidsOn ? 'block' : 'none',
      kidsOn: st.kidsOn,
      toggleKids: function () { self.setState({ kidsOn: !st.kidsOn }); },
      kidsBtnLabel: st.kidsOn ? 'Vue perso' : 'Voir les enfants',
      kidChips: kidChips, kidLanes: kidLanes, kidMemo: kidMemo,
      kidLaneShow: kidLanes.length ? 'flex' : 'none',
      openKidsModal: function () { self.setState({ modal: 'kids' }); },
      isKidsModal: st.modal === 'kids',

      womenMode: st.womenMode,
      womenShow: st.womenMode ? 'block' : 'none',
      cycleOn: cycleOn, cycleDay: cycleDay, cycleDays: cyc.days,
      cycleLabel: cycleOn ? 'Jour ' + cycleDay + ' sur ' + cyc.days : 'Aucun cycle en cours',
      cycleMissed: cyc.missed,
      cycleBadgeShow: cycleOn && st.view === 'day' ? 'flex' : 'none',
      toggleCycle: function () {
        if (cyc.active) {
          self.setState({ cycle: { active: false, startKey: null, days: cyc.days, missed: cyc.missed + cyc.days } });
          self.toast('Cycle terminé · ' + cyc.days + ' jours de jeûne à rattraper');
        } else {
          self.setState({ cycle: { active: true, startKey: dayKey, days: cyc.days, missed: cyc.missed } });
          self.toast('Plages de prière suspendues · séries préservées');
        }
      },
      cycleBtnLabel: cyc.active ? 'Terminer le cycle' : 'Démarrer un cycle',

      loadPct: loadPct + '%', loadNum: loadPct, loadBg: load.bg, loadBorder: load.border,
      loadInk: load.ink, loadBar: load.bar, loadTitle: load.title, loadSub: load.sub,
      loadHours: Math.floor(busyMin / 60) + 'h' + (busyMin % 60 ? String(busyMin % 60).padStart(2, '0') : ''),
      loadShow: st.womenMode && st.view === 'day' ? 'block' : 'none',

      isWeekReport: st.modal === 'weekreport',
      openWeekReport: function () { self.setState({ modal: 'weekreport' }); },
      weekRows: weekRows, weekDone: wkDone, weekAll: wkAll,
      weekPct: wkAll ? Math.round(wkDone / wkAll * 100) + '%' : '0%',
      weekRange: this.pd(wkKeys[0]).getDate() + ' – ' + this.pd(wkKeys[6]).getDate() + ' ' + this.MONTHS[this.pd(wkKeys[6]).getMonth()].toLowerCase(),
      weekSacrificed: weekSacrificed.join(', '),
      weekSacrificedShow: weekSacrificed.length ? 'block' : 'none',
      weekReportBadge: this.mdow(dayKey) === 4 ? 'flex' : 'none',

      isSettings: st.modal === 'settings',
      openSettings: function () { self.setState({ modal: 'settings' }); },
      settingsRows: [
        {
          label: 'Mode femme', sub: 'Cycle et dérogations, charge de la journée',
          on: st.womenMode,
          knob: st.womenMode ? 'translateX(18px)' : 'translateX(0)',
          track: st.womenMode ? '#0E7C5A' : '#DEDBD1',
          toggle: function () { self.setState({ womenMode: !st.womenMode }); }
        },
        {
          label: 'Agenda des enfants', sub: 'Superposer les emplois du temps de Maryam et Ilyas',
          on: st.kidsOn,
          knob: st.kidsOn ? 'translateX(18px)' : 'translateX(0)',
          track: st.kidsOn ? '#0E7C5A' : '#DEDBD1',
          toggle: function () { self.setState({ kidsOn: !st.kidsOn }); }
        },
        {
          label: 'Suggestions d\'adoration', sub: 'Proposer une adoration dans les créneaux libres',
          on: !st.suggestOff,
          knob: !st.suggestOff ? 'translateX(18px)' : 'translateX(0)',
          track: !st.suggestOff ? '#0E7C5A' : '#DEDBD1',
          toggle: function () { self.setState({ suggestOff: !st.suggestOff }); }
        }
      ],

      mosqueName: mosque.name, mosqueCity: mosque.city,
      mosqueSyncLabel: 'Horaires Mawaqit · maj il y a 2h',
      openMosqueModal: function () { self.setState({ modal: 'mosque' }); },
      isMosqueModal: st.modal === 'mosque',
      mq: st.mq, setMq: function (e) { self.setState({ mq: e.target.value }); },
      mosqueHits: mosqueHits, mosqueEmpty: mosqueHits.length === 0,

      reviewOpen: st.modal === 'review',
      openReview: function () { self.setState({ modal: 'review' }); },
      reviewRows: reviewRows, reviewDone: reviewDone, reviewTotal: sortedEvents.length,
      reviewMissed: undone.length, reviewPrayers: groupPrayers,
      reviewPagesToday: st.pagesToday,
      reviewTitle: undone.length === 0 ? 'Journée pleine' : undone.length + ' bloc(s) non fait(s)',
      reviewSub: undone.length === 0
        ? 'Tout ce que tu avais posé a été accompli. Qu\'Allāh te préserve la constance.'
        : 'Reporte-les à demain plutôt que de les effacer.',
      rollShow: undone.length ? 'block' : 'none',
      rollLabel: 'Reporter ' + undone.length + ' bloc(s) à demain',
      rollOver: function () {
        var nextKey = self.addDays(dayKey, 1);
        var all = Object.assign({}, st.events);
        var base = Date.now();
        var moved = undone.map(function (e, i) {
          return { id: base + i, name: e.name, s: e.s, e: e.e, cat: e.cat, ic: e.ic };
        });
        all[nextKey] = (all[nextKey] || []).concat(moved);
        all[dayKey] = (all[dayKey] || []).filter(function (x) {
          return !undone.some(function (u) { return u.id === x.id; });
        });
        self.setState({ events: all, modal: '', cur: nextKey });
        self.toast(moved.length + ' bloc(s) reporté(s) à ' + self.dayLabel(nextKey));
      },

      isTimeline: st.view === 'timeline', tlItems: tlItems,

      showSuggest: !st.suggestOff && st.view === 'day' && st.cur === this.TODAY_KEY,
      suggestSlot: this.hhmm(282 + bAfter) + ' – 06:00 · ' + (360 - 282 - bAfter) + ' min',
      acceptSuggest: function () {
        var s = 282 + bAfter;
        var ev = Object.assign({}, st.events);
        ev[st.cur] = (ev[st.cur] || []).concat([{ id: Date.now(), name: "Rester jusqu'au shurūq", s: s, e: 360, cat: 'coran', ic: 'coran' }]);
        self.setState({ events: ev, suggestOff: true });
        self.toast('Ajouté · ' + self.hhmm(s) + ' → 06:00');
      },
      dismissSuggest: function () { self.setState({ suggestOff: true }); },

      habits: habits, habitsDone: habitsDone, rewards: rewards,
      hp: st.hp, hpPct: Math.round(st.hp / 50 * 100) + '%',
      xp: st.xp % xpNeed, xpNeed: xpNeed, xpPct: Math.round((st.xp % xpNeed) / xpNeed * 100) + '%',
      coins: st.coins, lvl: st.lvl,

      surah: pg.surah, page: pg.page, pageOf: 'sur 147', juz: pg.juz,
      bismillah: pg.bismillah, ayat: pg.ayat, pagesToday: st.pagesToday,
      showReward: st.showReward, hasanat: st.hasanat.toLocaleString('fr-FR'),
      validatePage: function () {
        self.setState({
          pagesToday: st.pagesToday + 1,
          mi: (st.mi + 1) % self.PAGES.length,
          showReward: true,
          hasanat: Math.floor(250 + Math.random() * 120) * 10
        });
      },
      closeReward: function () { self.setState({ showReward: false }); },
      prevPage: function () { self.setState({ mi: (st.mi - 1 + self.PAGES.length) % self.PAGES.length }); },

      isPrayerModal: st.modal === 'prayer', isWeekModal: st.modal === 'week', isBlockModal: st.modal === 'block',
      closeModal: function () { self.setState({ modal: '' }); },
      openPrayerModal: function () { self.setState({ modal: 'prayer' }); },
      openWeekModal: function () { self.setState({ modal: 'week' }); },
      openBlockModal: function () { self.openNew(st.cur, 840); },

      bufFields: bufFields,
      bufTotal: (bBefore + bAfter) + ' min',
      bufSplit: bBefore + " min avant · " + bAfter + " min après l'adhan",
      savePrayer: function () { self.setState({ modal: '' }); self.toast('Plages mises à jour · ' + (bBefore + bAfter) + ' min par prière'); },

      wtDays: wtDays, wtTotal: wtTotal,
      applyWeek: function () {
        var acts = st.wt[4] || [];
        var base = Date.now();
        var add = acts.filter(function (a) {
          return !allEvents.some(function (e) { return e.name === a.name && e.s === a.time; });
        }).map(function (a, i) {
          return { id: base + i, name: a.name, s: a.time, e: a.time + a.dur, cat: a.cat };
        });
        var ev = Object.assign({}, st.events);
        ev[dayKey] = (ev[dayKey] || []).concat(add);
        self.setState({ events: ev, modal: '' });
        self.toast(add.length ? add.length + ' activité(s) ajoutée(s) à vendredi' : 'Déjà à jour pour vendredi');
      },

      nbTitle: st.nb.editing ? 'Modifier le bloc' : 'Nouveau bloc',
      nbDateLabel: this.dayLabel(st.nb.date) + ' ' + this.MONTHS[this.pd(st.nb.date).getMonth()].toLowerCase(),
      nbDates: this.weekKeys(st.nb.date).map(function (k, ix) {
        var on = k === st.nb.date;
        return {
          dow: self.DOWS_S[ix], num: self.pd(k).getDate(),
          bg: on ? '#1A1610' : '#FFFFFF', ink: on ? '#FFFFFF' : '#1A1610',
          dim: on ? 'rgba(255,255,255,.6)' : '#A8A399', border: on ? '#1A1610' : '#E4E1D8',
          pick: function () { self.setState({ nb: Object.assign({}, st.nb, { date: k }) }); }
        };
      }),
      nbEditing: !!st.nb.editing,
      deleteBlock: function () {
        if (!st.nb.editing) return;
        self.removeEvent(st.nb.editing.dk, st.nb.editing.id);
        self.setState({ modal: '', nb: Object.assign({}, st.nb, { editing: null, name: '' }) });
        self.toast('Bloc supprimé');
      },
      nbName: st.nb.name,
      setNbName: function (e) { self.setState({ nb: Object.assign({}, st.nb, { name: e.target.value }) }); },
      nbStart: st.nb.start, nbEnd: st.nb.end, times: times, nbDurLabel: nbDurLabel,
      setNbStart: function (e) {
        var v = parseInt(e.target.value, 10);
        var d = st.nb.end - st.nb.start;
        self.setState({ nb: Object.assign({}, st.nb, { start: v, end: Math.min(1440, v + Math.max(15, d)) }) });
      },
      setNbEnd: function (e) {
        var v = parseInt(e.target.value, 10);
        self.setState({ nb: Object.assign({}, st.nb, { end: Math.max(st.nb.start + 15, v) }) });
      },
      nbActions: nbActions, nbRecs: nbRecs,
      nbOwners: nbOwners, ownerIsKid: ownerIsKid,
      ownerKidName: ownerKid ? ownerKid.name : '',
      ownerNote: ownerKid ? 'Ce bloc ira dans l\'agenda de ' + ownerKid.name + ', visible en calque sur le tien.' : '',
      nbRewardTitle: nbAct.title, nbHadith: '« ' + nbAct.hadith + ' »', nbHadithSrc: nbAct.src,
      saveBlock: function () {
        var name = (st.nb.name || '').trim();
        if (!name) { self.toast('Donne un nom au bloc'); return; }
        var nb = st.nb;
        if ((nb.owner || 'me') !== 'me') {
          var kid = null;
          self.KIDS.forEach(function (k) { if (k.id === nb.owner) kid = k; });
          if (kid) {
            kid.blocks = kid.blocks.concat([{ id: Date.now(), name: name, s: nb.start, e: nb.end, cat: nb.cat, ic: nb.ic }]);
            var sh = Object.assign({}, st.kidsShown); sh[kid.id] = true;
            self.setState({
              modal: '', kidsOn: true, kidsShown: sh,
              nb: { name: '', autoName: true, start: 840, end: 900, act: 'coran', ic: 'coran', cat: 'coran', rec: 'once', date: nb.date, owner: nb.owner, editing: null }
            });
            self.toast(name + ' · agenda de ' + kid.name);
            return;
          }
        }
        var ev = Object.assign({}, st.events);
        var targets = [nb.date];
        if (nb.rec === 'daily') {
          targets = self.weekKeys(nb.date);
        } else if (nb.rec === 'weekly') {
          targets = [0, 1, 2, 3].map(function (w) { return self.addDays(nb.date, w * 7); });
        }
        if (nb.editing) {
          var old = ev[nb.editing.dk] || [];
          ev[nb.editing.dk] = old.filter(function (x) { return x.id !== nb.editing.id; });
        }
        var base = Date.now();
        targets.forEach(function (k, i) {
          ev[k] = (ev[k] || []).concat([{ id: base + i, name: name, s: nb.start, e: nb.end, cat: nb.cat, ic: nb.ic }]);
        });
        self.setState({
          events: ev, modal: '', cur: targets.indexOf(st.cur) !== -1 ? st.cur : nb.date,
          nb: { name: '', start: 840, end: 900, ic: 'coran', cat: 'coran', rec: 'once', date: nb.date, editing: null }
        });
        self.toast(nb.editing ? name + ' modifié' : (targets.length > 1 ? name + ' · ' + targets.length + ' occurrences' : name + ' · ' + self.hhmm(nb.start) + ' → ' + self.hhmm(nb.end)));
      },

      nav: nav, toast: st.toast,
      goToday: function () { self.setState({ screen: 'today' }); },
      streakToast: function () { self.toast('23 jours consécutifs'); },
      focusToast: function () { self.toast('Mode focus — porté à la prochaine étape'); },
      agendaToast: function () { self.toast('Navigation entre les jours — à venir'); },
      weekTemplateToast: function () { self.toast('Semaine type — portée à la prochaine étape'); }
    };
  }
}



function __boot() {
  __root = document.getElementById('dc-root');
  var holder = document.createElement('div');
  holder.innerHTML = document.getElementById('dc-template').textContent;
  __tplRoot = holder;
  __comp = new Component(__props);
  __render();
  if (__comp.componentDidMount) __comp.componentDidMount();
  __render();
}
document.addEventListener('DOMContentLoaded', __boot);

</script>
</body>
</html>
