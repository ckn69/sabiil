<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabīl</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0B2B21;-webkit-font-smoothing:antialiased}
  a{color:#0E7C5A;text-decoration:none}
  a:hover{color:#075E45;text-decoration:underline}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  ::-webkit-scrollbar{display:none}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:100px;background:#E4E1D8;outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:100px;background:#0E7C5A;border:2px solid #F7F6F2;box-shadow:0 1px 4px rgba(26,22,16,.25);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:100px;background:#0E7C5A;border:2px solid #F7F6F2;cursor:pointer}
  select{font-family:inherit}
  @keyframes sb-pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes sb-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sb-pop{from{opacity:0;transform:translate(-50%,6px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  @keyframes sb-wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

  /* --- Cadre : maquette sur desktop, plein écran sur mobile --- */
  html,body{height:100%}
  .sb-stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#124635 0%,#08211A 70%)}
  .sb-phone{width:min(400px,100%);height:min(848px,calc(100vh - 40px));background:#13150F;border-radius:44px;padding:9px;box-shadow:0 40px 90px -24px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07)}
  .sb-screen{width:100%;height:100%;background:#F7F6F2;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative;color:#1A1610}
  .sb-statusbar{height:44px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 7px;flex-shrink:0;font-size:13px;font-weight:600;letter-spacing:-0.01em}
  @media (max-width:600px){
    body{background:#F7F6F2}
    .sb-stage{padding:0;align-items:stretch;background:#F7F6F2}
    .sb-phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    .sb-screen{border-radius:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .sb-statusbar{display:none}
  }
</style>

</head>
<body>
<div id="dc-root"></div>
<script id="dc-template" type="text/x-template"><div class="sb-stage">
<div class="sb-phone">
<div class="sb-screen">

  <div class="sb-statusbar">
    <span>9:41</span>
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:11px;font-weight:700">5G</span>
      <div style="width:22px;height:10px;border:1px solid #1A1610;border-radius:3px;padding:1.5px"><div style="width:80%;height:100%;background:#1A1610;border-radius:1px"></div></div>
    </div>
  </div>

  <!-- ═══════════ MINI-LECTEUR GLOBAL ═══════════ -->
  <sc-if value="{{ miniShow }}" hint-placeholder-val="{{ false }}">
  <div style="flex-shrink:0;margin:0 12px 6px;background:#1A1610;border-radius:14px;overflow:hidden;box-shadow:0 10px 24px -12px rgba(26,22,16,.7);position:relative;z-index:25">
    <div style="display:flex;align-items:center;gap:9px;padding:8px 9px 9px">
      <button onClick="{{ mini.toggle }}" style="width:34px;height:34px;border-radius:11px;border:none;background:#0E7C5A;display:flex;align-items:center;justify-content:center;flex-shrink:0" style-active="transform:scale(.92)">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:#fff"><path d="{{ mini.playD }}"></path></svg>
      </button>
      <button onClick="{{ mini.openCourse }}" style="flex:1;min-width:0;background:none;border:none;text-align:left;padding:0">
        <div style="font-size:12.5px;font-weight:600;letter-spacing:-0.012em;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ mini.title }}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          <span style="font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:#E3C063;flex-shrink:0">{{ mini.pos }}</span>
          <span style="font-size:10px;font-weight:500;color:rgba(255,255,255,.45);flex-shrink:0">/ {{ mini.dur }}</span>
          <span style="font-size:10px;font-weight:500;color:rgba(255,255,255,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">· {{ mini.course }}</span>
        </div>
      </button>
      <button onClick="{{ mini.back }}" style="width:30px;height:30px;border-radius:9px;border:none;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M4 11.5A8 8 0 114.6 15"></path><path d="M3.5 6v5.5H9"></path></svg>
      </button>
      <button onClick="{{ mini.cycleRate }}" style="min-width:32px;height:30px;padding:0 7px;border-radius:9px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums">{{ mini.rateLabel }}</button>
      <button onClick="{{ mini.close }}" style="width:30px;height:30px;border-radius:9px;border:none;background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2.2;stroke-linecap:round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="height:2.5px;background:rgba(255,255,255,.12)">
      <div style="height:100%;background:#0E7C5A;width:{{ mini.pct }};transition:width .95s linear"></div>
    </div>
  </div>
  </sc-if>

  <!-- ═══════════ LECTEUR PLEIN ÉCRAN ═══════════ -->
  <sc-if value="{{ playerFullShow }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;background:#0F1310;z-index:80;display:flex;flex-direction:column;animation:sb-rise .24s cubic-bezier(.16,1,.3,1)">

    <div onPointerDown="{{ plFull.swipeStart }}" style="flex-shrink:0;padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;touch-action:none;cursor:grab">
      <div style="position:absolute;top:7px;left:50%;transform:translateX(-50%);width:34px;height:4px;background:rgba(255,255,255,.18);border-radius:100px"></div>
      <button onClick="{{ plFull.minimize }}" style="width:32px;height:32px;border-radius:10px;border:none;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin-top:6px">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button onClick="{{ plFull.openCourse }}" style="background:none;border:none;text-align:center;max-width:62%;padding:0;margin-top:6px">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ plFull.courseTitle }}</div>
      </button>
      <button onClick="{{ plFull.close }}" style="width:32px;height:32px;border-radius:10px;border:none;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin-top:6px">
        <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,.65);stroke-width:2.2;stroke-linecap:round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:10px 28px">
      <div style="width:180px;height:180px;border-radius:28px;background:linear-gradient(150deg,#0E7C5A,#075E45 55%,#043729);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:{{ plFull.coverShadow }};transform:{{ plFull.coverScale }};transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s ease">
        <svg viewBox="0 0 24 24" style="width:56px;height:56px;fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M4 19V5l16-2v14"></path><circle cx="6" cy="19" r="2.5"></circle><circle cx="18" cy="17" r="2.5"></circle></svg>
      </div>

      <div style="width:100%;text-align:center;margin-top:26px">
        <div style="font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-0.015em;color:#fff;line-height:1.25">{{ plFull.lessonTitle }}</div>
        <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,.45);margin-top:6px">{{ plFull.lessonMeta }}</div>
      </div>

      <div style="width:100%;display:flex;align-items:flex-end;gap:2.5px;height:36px;margin-top:26px">
        <sc-for list="{{ plFull.bars }}" as="b" hint-placeholder-count="44">
          <div style="flex:1;border-radius:2px;background:{{ b.color }};height:{{ b.h }};animation:{{ b.anim }};animation-delay:{{ b.delay }};transition:background .3s ease"></div>
        </sc-for>
      </div>

      <div onClick="{{ plFull.seekTrack }}" style="width:100%;height:14px;display:flex;align-items:center;margin-top:10px">
        <div style="width:100%;height:4px;border-radius:100px;background:rgba(255,255,255,.15);position:relative">
          <div style="height:100%;border-radius:100px;background:#0E7C5A;width:{{ plFull.pct }};transition:width .95s linear"></div>
          <div style="position:absolute;top:50%;left:{{ plFull.pct }};width:12px;height:12px;border-radius:100px;background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4);transition:left .95s linear"></div>
        </div>
      </div>
      <div style="width:100%;display:flex;justify-content:space-between;margin-top:6px">
        <span style="font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.45)">{{ plFull.pos }}</span>
        <span style="font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.45)">{{ plFull.left }}</span>
      </div>
    </div>

    <div style="flex-shrink:0;padding:8px 24px 6px;display:flex;align-items:center;justify-content:center;gap:22px">
      <button onClick="{{ plFull.prev }}" style="width:38px;height:38px;border-radius:100px;border:none;background:none;display:flex;align-items:center;justify-content:center;opacity:{{ plFull.prevOpacity }}">
        <svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:rgba(255,255,255,.85)"><path d="M6 6h2.5v12H6zM18 6L8 12l10 6z"></path></svg>
      </button>
      <button onClick="{{ plFull.back }}" style="width:38px;height:38px;border-radius:100px;border:none;background:none;display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M4 11.5A8 8 0 114.6 15"></path><path d="M3.5 6v5.5H9"></path></svg>
      </button>
      <button onClick="{{ plFull.toggle }}" style="width:66px;height:66px;border-radius:100px;border:none;background:#0E7C5A;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -8px rgba(14,124,90,.6)" style-active="transform:scale(.94)">
        <svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:#fff"><path d="{{ plFull.playD }}"></path></svg>
      </button>
      <button onClick="{{ plFull.fwd }}" style="width:38px;height:38px;border-radius:100px;border:none;background:none;display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M20 11.5A8 8 0 1119.4 15"></path><path d="M20.5 6v5.5H15"></path></svg>
      </button>
      <button onClick="{{ plFull.next }}" style="width:38px;height:38px;border-radius:100px;border:none;background:none;display:flex;align-items:center;justify-content:center;opacity:{{ plFull.nextOpacity }}">
        <svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:rgba(255,255,255,.85)"><path d="M18 6h-2.5v12H18zM6 6l10 6-10 6z"></path></svg>
      </button>
    </div>

    <div style="flex-shrink:0;padding:8px 20px 24px;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <button onClick="{{ plFull.cycleRate }}" style="flex:1;height:36px;border-radius:100px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M12 7v5l3.5 2"></path><circle cx="12" cy="12" r="8.5"></circle></svg>
        {{ plFull.rateLabel }}
      </button>
      <button onClick="{{ plFull.addNote }}" style="flex:1;height:36px;border-radius:100px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M16.5 3.5l4 4L9 19l-5 1 1-5z"></path><path d="M14 6l4 4"></path></svg>
        Note
      </button>
      <button onClick="{{ plFull.openCourse }}" style="flex:1;height:36px;border-radius:100px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M4 5.5h7v14H4z"></path><path d="M13 5.5h7v14h-7z"></path></svg>
        Cours
      </button>
    </div>

  </div>
  </sc-if>

  <!-- ═══════════ COURS ═══════════ -->
  <sc-if value="{{ isCourse }}" hint-placeholder-val="{{ false }}">
  <div style="flex:1;display:flex;flex-direction:column;min-height:0">

    <div style="flex-shrink:0;padding:2px 16px 12px">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <button onClick="{{ cs.close }}" style="width:30px;height:30px;border-radius:9px;border:1px solid #E4E1D8;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#4F4B40;stroke-width:2.5;stroke-linecap:round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div style="flex:1;min-width:0">
          <div style="font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-0.015em;line-height:1.2">{{ cs.name }}</div>
          <div style="font-size:11.5px;font-weight:600;color:#8A8578;margin-top:3px">{{ cs.meta }}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
        <div style="flex:1;min-width:0;height:5px;background:#EFEDE6;border-radius:100px;overflow:hidden">
          <div style="height:100%;background:#0E7C5A;border-radius:100px;width:{{ cs.pct }}"></div>
        </div>
        <div style="font-size:11px;font-weight:700;color:#4F4B40;font-variant-numeric:tabular-nums;flex-shrink:0">{{ cs.heard }}/{{ cs.total }} écoutées</div>
      </div>
    </div>

    <div style="flex-shrink:0;padding:0 16px 12px">
      <div style="display:flex;background:#EFEDE6;border-radius:11px;padding:3px;gap:2px">
        <sc-for list="{{ cs.tabs }}" as="t" hint-placeholder-count="4">
          <button onClick="{{ t.pick }}" style="flex:1;border:none;padding:8px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;background:{{ t.bg }};box-shadow:{{ t.shadow }}">
            <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke:{{ t.ink }}"><path d="{{ t.d }}"></path><path d="{{ t.d2 }}"></path></svg>
            <span style="font-size:10px;font-weight:700;color:{{ t.ink }}">{{ t.label }}</span>
            <svg viewBox="0 0 24 24" style="position:absolute;top:4px;right:6px;width:9px;height:9px;fill:none;stroke:#C9C4B4;stroke-width:2.4;stroke-linecap:round;display:{{ t.lockShow }}"><path d="M5.5 11h13v9.5h-13z"></path><path d="M8.5 11V8a3.5 3.5 0 017 0v3"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;min-height:0;padding:0 16px 96px">

      <sc-if value="{{ cs.isAudio }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ cs.playAll }}" style="width:100%;background:#1A1610;border:none;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;text-align:left;color:#fff;margin-bottom:12px">
          <div style="width:38px;height:38px;border-radius:11px;background:#0E7C5A;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#fff"><path d="M7 4.5v15l12-7.5z"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,.5)">Audio du cours</div>
            <div style="font-size:13.5px;font-weight:600;letter-spacing:-0.012em;margin-top:2px">{{ cs.playAllLabel }}</div>
          </div>
        </button>

        <div style="background:#fff;border:1px solid #E4E1D8;border-radius:14px;overflow:hidden">
          <sc-for list="{{ cs.lessons }}" as="l" hint-placeholder-count="6">
            <button onClick="{{ l.play }}" style="width:100%;border:none;padding:11px 13px;text-align:left;border-bottom:{{ l.divider }};background:{{ l.rowBg }}">
              <div style="display:flex;align-items:center;gap:11px">
                <div style="width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;background:{{ l.numBg }};color:{{ l.numInk }}">{{ l.n }}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600;letter-spacing:-0.012em;line-height:1.25;color:{{ l.nameInk }}">{{ l.title }}</div>
                  <div style="font-size:10.5px;font-weight:600;color:#A8A399;margin-top:2px;font-variant-numeric:tabular-nums">{{ l.dur }}</div>
                </div>
                <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:#0E7C5A;stroke-width:2.6;stroke-linecap:round;flex-shrink:0;display:{{ l.stateShow }}"><path d="M5 13l4 4L19 7"></path></svg>
                <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:#C9C4B4;flex-shrink:0;display:{{ l.playShow }}"><path d="{{ l.playIcon }}"></path></svg>
              </div>
              <div style="height:3px;background:#E4E1D8;border-radius:100px;overflow:hidden;margin:9px 0 1px;display:{{ l.barShow }}">
                <div style="height:100%;background:#0E7C5A;border-radius:100px;width:{{ l.barPct }};transition:width .95s linear"></div>
              </div>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ cs.isNotes }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFFDF7;border:1px solid #EDE4D0;border-radius:14px;padding:13px;margin-bottom:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
            <div style="font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#9C8F6C">Notes de ce cours</div>
            <button onClick="{{ cs.insertStamp }}" style="border:1px solid #EDE4D0;background:#F3ECDC;color:#6B5D3A;border-radius:100px;padding:5px 11px;font-size:10.5px;font-weight:700;flex-shrink:0">+ Horodater</button>
          </div>
          <textarea value="{{ cs.noteDraft }}" onChange="{{ cs.setNote }}" placeholder="Ce que tu retiens de ce cours…" style="width:100%;min-height:200px;background:transparent;border:none;resize:none;outline:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;font-weight:500;color:#2E2616;line-height:1.7"></textarea>
        </div>

      </button>

    <div style="padding:2px 20px 0">

            </button>

        <sc-if value="{{ gd.idle }}" hint-placeholder-val="{{ true }}">

            <input value="{{ gd.draft }}" onChange="{{ gd.setDraft }}" placeholder="Écrire au groupe..." style="flex:1;min-width:0;background:#fff;border:1px solid #E4E1D8;border-radius:100px;padding:10px 15px;font-size:12.5px;font-weight:500;color:#1A1610;outline:none" />

              <svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:#4F4B40;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3.5a2.8 2.8 0 012.8 2.8v5.4a2.8 2.8 0 01-5.6 0V6.3A2.8 2.8 0 0112 3.5z"></path><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5v3M9 20.5h6"></path></svg>

            </button>

        </sc-if>

      <sc-if value="{{ gd.isBlocs }}" hint-placeholder-val="{{ false }}">

                <svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke:{{ b.ink }}"><path d="{{ b.d }}"></path><path d="{{ b.d2 }}"></path></svg>
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13.5px;font-weight:600;letter-spacing:-0.012em;line-height:1.25">{{ b.name }}</div>

            <div style="display:flex;gap:7px;margin-top:11px">

            </div>
          </div>
        </sc-for>
      </sc-if>

      <sc-if value="{{ gd.isMembres }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ gd.openInvite }}" style="width:100%;background:#fff;border:1px dashed #C9C4B4;border-radius:14px;padding:12px 13px;margin-bottom:10px;align-items:center;gap:11px;text-align:left;display:{{ gd.inviteShow }}">
          <div style="width:32px;height:32px;border-radius:9px;background:#F7F6F2;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:#4F4B40;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M9 11a3.4 3.4 0 100-6.8 3.4 3.4 0 000 6.8"></path><path d="M2.5 20c0-3.2 2.9-5.5 6.5-5.5s6.5 2.3 6.5 5.5M18 8v6M15 11h6"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;letter-spacing:-0.012em">Inviter un frère</div>
            <div style="font-size:10.5px;font-weight:600;color:#A8A399;margin-top:1px">Par lien privé ou code</div>
          </div>
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:#C9C4B4;stroke-width:2.5;stroke-linecap:round;flex-shrink:0"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <div style="background:#fff;border:1px solid #E4E1D8;border-radius:14px;overflow:hidden">
          <sc-for list="{{ gd.members }}" as="m" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:{{ m.divider }}">
              <div style="width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;flex-shrink:0;position:relative;background:{{ m.color }}">
                {{ m.initial }}
                <div style="position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:100px;border:2px solid #fff;background:#0E7C5A;display:{{ m.onlineShow }}"></div>
              </div>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:6px">
                  <span style="font-size:13px;font-weight:700;letter-spacing:-0.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ m.name }}</span>
                  <span style="display:inline-flex;align-items:center;gap:3px;font-size:8.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;flex-shrink:0;background:{{ m.roleBg }};color:{{ m.roleInk }}">
                    <svg viewBox="0 0 24 24" style="width:9px;height:9px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke:{{ m.roleInk }}"><path d="{{ m.roleD }}"></path><path d="{{ m.roleD2 }}"></path></svg>{{ m.role }}
                  </span>
                </div>
                <div style="font-size:11px;font-weight:600;color:#A8A399;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ m.status }}</div>

              <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
                <svg viewBox="0 0 24 24" style="width:11px;height:11px;fill:#B08D4F"><path d="M13.5 1c1.8 4.8-2.6 6.2-2.6 9.6 0 2.6 1.7 4.4 3.5 4.4s3.5-1.8 3.5-4.4c0-1.7-.9-2.6-1.7-3.5 2.6.9 4.4 3.5 4.4 6.1 0 3.5-2.6 6.1-6.1 6.1s-7-2.6-7-6.1c0-2.6 1.7-4.4 3.5-6.1-1.7-.9-2.6-2.6-2.6-4.4 0-2.6 1.7-1.7 5.2-1.7z"></path></svg>
                <span style="font-size:11.5px;font-weight:700;color:#8A5E1F;font-variant-numeric:tabular-nums">{{ m.streak }}</span>
              </div>
              <button onClick="{{ m.manage }}" style="width:26px;height:26px;border-radius:8px;border:none;background:#F7F6F2;align-items:center;justify-content:center;flex-shrink:0;display:{{ m.manageShow }}">
                <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#A8A399"><circle cx="12" cy="5.5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="18.5" r="1.7"></circle></svg>
              </button>

      <sc-if value="{{ gd.isNotes }}" hint-placeholder-val="{{ false }}">

              <div style="width:22px;height:22px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;flex-shrink:0;background:{{ n.color }}">{{ n.initial }}</div>
              <div style="flex:1;min-width:0;font-size:11px;font-weight:700;color:#6B6759">{{ n.author }}</div>
              <div style="font-size:10px;font-weight:600;color:#B6B1A5;flex-shrink:0">{{ n.time }}</div>

          </div>

                  <div style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#1A1610;flex-shrink:0">{{ r.val }}</div>

  <sc-if value="{{ isInviteModal }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;background:rgba(26,22,16,.45);z-index:60;display:flex;flex-direction:column;justify-content:flex-end">
    <div style="background:#F7F6F2;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sb-rise .28s cubic-bezier(.16,1,.3,1)">
      <div style="width:34px;height:4px;background:#DEDBD1;border-radius:100px;margin:9px auto 0;flex-shrink:0"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 14px;flex-shrink:0">
        <button onClick="{{ closeGModal }}" style="background:none;border:none;font-size:13.5px;font-weight:600;color:#8A8578">Fermer</button>
        <div style="font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;letter-spacing:-0.015em">Inviter au groupe</div>
        <div style="width:46px"></div>
      </div>
      <div style="padding:0 18px 24px">

        <div style="background:#1A1610;border-radius:16px;padding:16px 17px;color:#fff;margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:11px">
            <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:rgba(255,255,255,.55);stroke-width:2.2;stroke-linecap:round;flex-shrink:0"><path d="M5.5 11h13v9.5h-13z"></path><path d="M8.5 11V8a3.5 3.5 0 017 0v3"></path></svg>
            <div style="font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,.55)">Lien privé · 7 jours</div>
          </div>
          <div style="font-size:14px;font-weight:600;letter-spacing:-0.01em;word-break:break-all;line-height:1.4">{{ gd.inviteLink }}</div>
          <div style="display:flex;gap:7px;margin-top:14px">
            <button onClick="{{ gd.copyLink }}" style="flex:1;border:none;border-radius:11px;padding:11px;background:#fff;color:#1A1610;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#1A1610;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M8.5 8.5h11v11h-11z"></path><path d="M5.5 15.5h-1v-11h11v1"></path></svg>Copier
            </button>
            <button onClick="{{ gd.shareLink }}" style="flex:1;border:none;border-radius:11px;padding:11px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M14.5 3.5h6v6"></path><path d="M20.5 3.5L11 13M17 14v6.5H4V7.5h6"></path></svg>Partager

          </div>
        </div>

        <div style="font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#8A8578;padding:0 2px 9px">Code manuel</div>
        <div style="background:#fff;border:1px dashed #C9C4B4;border-radius:14px;padding:15px;text-align:center;margin-bottom:14px">

  seg(html) {
    var out = [], re = /<strong>(.*?)<\/strong>/g, last = 0, m;
    while ((m = re.exec(html)) !== null) {
      if (m.index > last) out.push({ t: html.slice(last, m.index), w: '500', c: '#373329' });
      out.push({ t: m[1], w: '700', c: '#1A1610' });
      last = m.index + m[0].length;
    }
    if (last < html.length) out.push({ t: html.slice(last), w: '500', c: '#373329' });
    return out;
  }

  componentDidMount() {
    var s = this.props.startScreen;
    if (s && s !== this.state.screen) this.setState({ screen: s });
  }

  componentWillUnmount() {
    if (this._t) clearTimeout(this._t);
    if (this._rec) clearInterval(this._rec);
    if (this._pl) clearInterval(this._pl);
  }

  componentDidUpdate(prevProps, prevState) {
    // la grille part de 00h : cadrer sur la matinée plutôt que sur les heures mortes
    if (prevState.screen !== 'agenda' && this.state.screen === 'agenda') this.frameGrid();
    if (prevState.view !== this.state.view && this.state.view === 'day') this.frameGrid();
  }

  frameGrid() {
    var el = this._grid;
    if (!el) return;
    var self = this;
    requestAnimationFrame(function () {
      if (!self._grid) return;
      self._grid.scrollTop = Math.max(0, (self.NOW - 150) / 60 * self.HH);
    });
  }

  tint(cat) {
    if (this.props.mono) return { bg: '#EFEDE6', ink: '#4F4B40', bar: '#8A8578' };
    return this.CAT[cat] || this.CAT.travail;
  }

  hhmm(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  px(m) { return ((m - this.DAY0) / 60 * this.HH).toFixed(1) + 'px'; }

  toast(msg) {
    this.setState({ toast: msg });
    if (this._t) clearTimeout(this._t);
    this._t = setTimeout(function () { this.setState({ toast: '' }); }.bind(this), 2200);
  }

  cycle(name) {
    var order = ['pending', 'group', 'alone', 'missed'];
    var labels = { pending: 'à venir', group: 'accomplie en groupe', alone: 'accomplie seul', missed: 'manquée' };
    var ps = Object.assign({}, this.state.ps);
    var cur = ps[name] === 'current' ? 'pending' : ps[name];
    var next = order[(order.indexOf(cur) + 1) % 4];
    ps[name] = next;
    this.setState({ ps: ps });
    this.toast(name + ' · ' + labels[next]);
  }

    for (var h = 0; h <= 23; h++) hours.push({ label: String(h).padStart(2, '0') + 'h', top: this.px(h * 60) });

    var SB = {
      group:   { bg: '#E6F1EB', border: '#CBE3D6', ink: '#0B6349', status: 'En groupe' },
      alone:   { bg: '#F7EFDD', border: '#EADFC4', ink: '#8A5E1F', status: 'Seul' },
      missed:  { bg: '#F7E4DE', border: '#EDCEC5', ink: '#A33D25', status: 'Manquée' },
      current: { bg: '#E6F1EB', border: '#0E7C5A', ink: '#0B6349', status: 'En cours' },
      pending: { bg: '#F1F0EA', border: '#E4E1D8', ink: '#6B6759', status: 'Réservé' }
    };
    var prayerBands = PR.map(function (p) {
      var s = SB[st.ps[p.n]] || SB.pending;
      var a = Math.max(0, p.m - bBefore), b = Math.min(1440, p.m + bAfter);
      return {
        name: p.n, status: s.status, bg: s.bg, border: s.border, ink: s.ink,
        range: self.hhmm(a) + ' – ' + self.hhmm(b),
        top: self.px(a), h: ((b - a) / 60 * self.HH).toFixed(1) + 'px',
        cycle: function () { self.cycle(p.n); }
      };
    });

    // grouper les blocs qui se chevauchent en colonnes côte à côte
    var byStart = allEvents.slice().sort(function (a, b) { return a.s - b.s || a.e - b.e; });
    var clusters = [], cluster = [], clusterEnd = -1;
    byStart.forEach(function (e) {
      if (cluster.length && e.s >= clusterEnd) { clusters.push(cluster); cluster = []; clusterEnd = -1; }
      cluster.push(e);
      clusterEnd = Math.max(clusterEnd, e.e);
    });
    if (cluster.length) clusters.push(cluster);

    var eventBlocks = [];
    clusters.forEach(function (cl) {
      var colEnds = [];
      var placed = cl.map(function (e) {
        var col = -1;
        for (var c = 0; c < colEnds.length; c++) { if (e.s >= colEnds[c]) { col = c; break; } }
        if (col === -1) { col = colEnds.length; colEnds.push(0); }
        colEnds[col] = e.e;
        return { e: e, col: col };
      });
      var cols = colEnds.length;
      placed.forEach(function (p) {
        var t = self.tint(p.e.cat);
        eventBlocks.push({
          name: p.e.name, bg: t.bg, ink: t.ink, bar: t.bar,
          range: self.hhmm(p.e.s) + ' – ' + self.hhmm(p.e.e),
          top: self.px(p.e.s), h: ((p.e.e - p.e.s) / 60 * self.HH).toFixed(1) + 'px',
          left: (p.col * 100 / cols).toFixed(3) + '%',
          width: cols === 1 ? '100%' : 'calc(' + (100 / cols).toFixed(3) + '% - 3px)',
          evRef: p.e, ring: 'none', alertShow: 'none',
          grpShow: p.e.grp ? 'block' : 'none', grpColor: p.e.grpColor || t.bar,
          opacity: st.done[dayKey + '|' + p.e.id] ? '.55' : '1',
          z: st.dragging === p.e.id ? '8' : '2',
          shadow: st.dragging === p.e.id ? '0 8px 18px -6px rgba(26,22,16,.4)' : 'none',
          press: function (ev) { self.startDrag(ev, p.e, 'move'); },
          resize: function (ev) { self.startDrag(ev, p.e, 'resize'); }
        });
      });
    });

    var views = [
      { key: 'day', label: 'Jour' }, { key: 'three', label: '3 j.' },
      { key: 'week', label: 'Sem.' }, { key: 'month', label: 'Mois' },
      { key: 'timeline', label: 'Liste' }
    ].map(function (v) {
      var on = st.view === v.key;
      return {
        label: v.label, bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#1A1610' : '#8A8578',
        shadow: on ? '0 1px 3px rgba(26,22,16,.1)' : 'none',
        pick: function () { self.setState({ view: v.key, detail: null }); }
      };
    });

    var wk = this.weekKeys(st.cur);
    var weekStrip = wk.map(function (k, ix) {
      var on = k === st.cur;
      var isT = k === self.TODAY_KEY;
      var cnt = (st.events[k] || []).length;
      return {
        dow: self.DOWS_S[ix], num: self.pd(k).getDate(),
        bg: on ? '#0E7C5A' : '#FFFFFF', border: on ? '#0E7C5A' : (isT ? '#B08D4F' : '#E4E1D8'),
        ink: on ? '#FFFFFF' : '#1A1610', dim: on ? 'rgba(255,255,255,.65)' : '#A8A399',
        dotBg: cnt ? (on ? 'rgba(255,255,255,.75)' : '#C9C4B4') : 'transparent',
        pick: function () { self.setState({ cur: k, detail: null }); }
      };
    });

    // ── vues multi-jours ──
    var HH2 = 34;
    var px2 = function (m) { return (m / 60 * HH2).toFixed(1) + 'px'; };
    var hours2 = [];
    for (var h2 = 0; h2 <= 23; h2++) hours2.push({ label: String(h2).padStart(2, '0'), top: px2(h2 * 60) });

    var colKeys = st.view === 'three' ? [st.cur, this.addDays(st.cur, 1), this.addDays(st.cur, 2)]
      : (st.view === 'week' ? wk : []);
    var wide = st.view === 'three';
    var dayCols = colKeys.map(function (k) {
      var evs = (st.events[k] || []).slice().sort(function (a, b) { return a.s - b.s; });
      var isCur = k === st.cur, isT = k === self.TODAY_KEY;
      return {
        dow: self.DOWS_S[self.mdow(k)], num: self.pd(k).getDate(),
        headBg: isCur ? '#0E7C5A' : (isT ? '#F7EFDD' : 'transparent'),
        headInk: isCur ? '#FFFFFF' : '#1A1610',
        headDim: isCur ? 'rgba(255,255,255,.7)' : '#A8A399',
        pick: function () { self.setState({ cur: k, view: 'day', detail: null }); },
        nowShow: (isT && st.view !== 'month') ? 'block' : 'none',
        nowTop: px2(self.NOW),
        blocks: evs.map(function (e) {
          var t = self.tint(e.cat);
          return {
            name: wide ? e.name : '', bg: t.bg, bar: t.bar, ink: t.ink,
            top: px2(e.s), h: Math.max(9, (e.e - e.s) / 60 * HH2).toFixed(1) + 'px',
            open: function () { self.setState({ cur: k, detail: { dk: k, id: e.id } }); }
          };
        })
      };
    });

    // ── vue mois ──
    var mRef = this.pd(st.cur);
    var mFirstKey = mRef.getFullYear() + '-' + String(mRef.getMonth() + 1).padStart(2, '0') + '-01';
    var mStart = this.addDays(mFirstKey, -this.mdow(mFirstKey));
    var monthCells = [];
    for (var mi = 0; mi < 42; mi++) {
      (function (i) {
        var k = self.addDays(mStart, i);
        var d = self.pd(k);
        var inM = d.getMonth() === mRef.getMonth();
        var evs = st.events[k] || [];
        var isCur = k === st.cur, isT = k === self.TODAY_KEY;
        monthCells.push({
          num: d.getDate(),
          bg: isCur ? '#0E7C5A' : (isT ? '#F7EFDD' : '#FFFFFF'),
          border: isCur ? '#0E7C5A' : (isT ? '#EADFC4' : '#E9E6DE'),
          ink: isCur ? '#FFFFFF' : (inM ? '#1A1610' : '#C9C4B4'),
          dots: evs.slice(0, 4).map(function (e) {
            return { bg: isCur ? 'rgba(255,255,255,.85)' : self.tint(e.cat).bar };
          }),
          pick: function () { self.setState({ cur: k, view: 'day', detail: null }); }
        });
      })(mi);
    }

    // ── créneaux vides cliquables ──
    var emptyCells = [];
    for (var ec = 0; ec <= 23; ec++) {
      (function (hh) {
        emptyCells.push({
          top: self.px(hh * 60), h: self.HH + 'px',
          add: function () { self.openNew(st.cur, hh * 60); }
        });
      })(ec);
    }

    // ── fiche détail d'un bloc ──
    var det = null;
    if (st.detail) {
      var dl = (st.events[st.detail.dk] || []).filter(function (x) { return x.id === st.detail.id; })[0];
      if (dl) {
        var dt = this.tint(dl.cat), dm = CM[dl.cat] || CM.travail;
        var dkey = st.detail.dk + '|' + dl.id, isDone = !!st.done[dkey];
        var dmin = dl.e - dl.s;
        det = {
          name: dl.name, cat: dm.label, bg: dt.bg, ink: dt.ink, bar: dt.bar,
          d: this.IC[dl.ic || dm.ic][0], d2: this.IC[dl.ic || dm.ic][1],
          range: this.hhmm(dl.s) + ' – ' + this.hhmm(dl.e),
          dayLabel: this.dayLabel(st.detail.dk),
          dur: dmin >= 60 ? (dmin % 60 === 0 ? Math.floor(dmin / 60) + 'h' : Math.floor(dmin / 60) + 'h' + (dmin % 60)) : dmin + ' min',
          doneLabel: isDone ? 'Marquer non fait' : 'Marquer comme fait',
          doneBg: isDone ? '#EFEDE6' : '#0E7C5A', doneInk: isDone ? '#4F4B40' : '#FFFFFF',
          toggle: function () {
            var n = Object.assign({}, st.done); n[dkey] = !n[dkey];
            self.setState({ done: n, detail: null });
            self.toast(n[dkey] ? dl.name + ' · fait' : dl.name + ' · à refaire');
          },
          conflict: (function () {
            var b = null;
            for (var ci = 0; ci < bandList.length; ci++) {
              var bb = bandList[ci];
              if (dl.s < bb.b && dl.e > bb.a) b = bb;
            }
            if (!b) return null;
            var len = dl.e - dl.s;
            return {
              name: b.n,
              range: self.hhmm(b.a) + ' – ' + self.hhmm(b.b),
              beforeLabel: 'Avant · ' + self.hhmm(Math.max(0, b.a - len)),
              afterLabel: 'Après · ' + self.hhmm(b.b),
              moveBefore: function () {
                var ns = Math.max(0, b.a - len);
                self.patchEvent(st.detail.dk, dl.id, { s: ns, e: ns + len });
                self.setState({ detail: null }); self.toast(dl.name + ' déplacé avant ' + b.n);
              },
              moveAfter: function () {
                var ne = Math.min(1440, b.b + len);
                self.patchEvent(st.detail.dk, dl.id, { s: b.b, e: ne });
                self.setState({ detail: null }); self.toast(dl.name + ' déplacé après ' + b.n);
              }
            };
          })(),
          hadith: (function () {
            var a = null;
            self.ACTIONS.forEach(function (x) { if (x.cat === dl.cat) { if (!a) a = x; } });
            if (!a) return null;
            return { title: a.title, text: '« ' + a.hadith + ' »', src: a.src };
          })(),
          edit: function () {
            self.setState({
              modal: 'block', detail: null,
              nb: { name: dl.name, start: dl.s, end: dl.e, ic: dl.ic || dm.ic, cat: dl.cat, rec: 'once', date: st.detail.dk, editing: { dk: st.detail.dk, id: dl.id } }
            });
          },
          del: function () { self.removeEvent(st.detail.dk, dl.id); self.toast(dl.name + ' supprimé'); }
        };
      }
    }

    // ── habitudes ──
    var habitsDone = 0;
    var habits = this.HAB.map(function (h) {
      var d = !!st.hd[h.id];
      if (d) habitsDone++;
      var t = self.tint(h.cat);
      var df = self.DIFF[h.diff];
      return {
        name: h.name, streak: h.streak, diffLabel: df.label, xp: df.xp,
        bg: t.bg, ink: t.ink, d: self.IC[h.ic][0], d2: self.IC[h.ic][1],
        cardBg: d ? '#F2F7F4' : '#FFFFFF', nameInk: d ? '#4F4B40' : '#1A1610',
        checkBg: d ? '#0E7C5A' : '#FFFFFF', checkBorder: d ? '#0E7C5A' : '#DEDBD1',
        checkInk: d ? '#FFFFFF' : '#DEDBD1',
        hist: h.hist.map(function (v) { return { bg: v ? '#8FC4AE' : '#EFEDE6' }; }),
        toggle: function () {
          var n = Object.assign({}, st.hd);
          n[h.id] = !n[h.id];
          var gain = n[h.id] ? 1 : -1;
          self.setState({ hd: n, xp: Math.max(0, st.xp + gain * df.xp), coins: Math.max(0, st.coins + gain * df.c) });
          if (gain > 0) self.toast('+' + df.xp + ' XP · +' + df.c + ' pièces');
        }
      };
    });
    var xpNeed = st.lvl * 120;
    var rewards = this.REW.map(function (r) {
      var ok = st.coins >= r.price;
      var t = self.tint(r.cat);
      return {
        name: r.name, price: r.price + ' ⬤', bg: t.bg, ink: t.ink,
        d: self.IC[r.ic][0], d2: self.IC[r.ic][1],
        border: ok ? '#DEC9A0' : '#E4E1D8', priceInk: ok ? '#8A5E1F' : '#B6B1A5',
        buy: function () {
          if (!ok) { self.toast('Il te manque ' + (r.price - st.coins) + ' pièces'); return; }
          self.setState({ coins: st.coins - r.price });
          self.toast(r.name + ' débloqué');
        }
      };
    });

    // ── mushaf ──
    var pg = this.PAGES[st.mi];

    // ── apprendre ──
    var prog = this.PROG[st.prog];
    var INFO = {};
    Object.keys(this.PROG).forEach(function (pk) {
      self.PROG[pk].levels.forEach(function (lv) {
        lv.modules.forEach(function (m) { INFO[m.name] = self.modInfo(m.name); });
      });
    });
    var totalDone = 0, totalAll = 0;
    prog.levels.forEach(function (lv) {
      lv.modules.forEach(function (m) { totalDone += INFO[m.name].done; totalAll += INFO[m.name].total; });
    });
    var learnPctNum = totalAll ? Math.round(totalDone / totalAll * 100) : 0;
    var lv1 = prog.levels[0];
    var lv1Done = 0, lv1All = 0;
    lv1.modules.forEach(function (m) { lv1Done += INFO[m.name].done; lv1All += INFO[m.name].total; });

    var programs = Object.keys(this.PROG).map(function (k) {
      var on = st.prog === k;
      return {
        label: self.PROG[k].label, d: self.IC[self.PROG[k].ic][0], d2: self.IC[self.PROG[k].ic][1],
        bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#1A1610' : '#8A8578',
        shadow: on ? '0 1px 3px rgba(26,22,16,.1)' : 'none',
        pick: function () { self.setState({ prog: k }); }
      };
    });

    var levels = prog.levels.map(function (lv, lix) {
      var d = 0, a = 0;
      lv.modules.forEach(function (m) { d += INFO[m.name].done; a += INFO[m.name].total; });
      var locked = lix > 0 && lv1Done < lv1All;
      var last = lv.modules.length - 1;
      var nextLv = prog.levels[lix + 1];
      var modDone = 0;
      lv.modules.forEach(function (m) { if (INFO[m.name].done === INFO[m.name].total) modDone++; });
      var stepsAll = a + 1, stepsDone = d;
      var nextStep = null;
      if (lix === 0 && nextLv) {
        nextStep = {
          title: 'Débloquer le ' + nextLv.eyebrow,
          pct: Math.round(stepsDone / stepsAll * 100) + '%',
          barW: Math.round(stepsDone / stepsAll * 100) + '%',
          steps: stepsDone + ' / ' + stepsAll + ' étapes accomplies',
          reward: 'Badge « Apprenant accompli »',
          rows: [
            {
              label: 'Terminer tous les modules du ' + lv.eyebrow,
              val: d + '/' + a,
              valInk: d === a ? '#0E7C5A' : '#E3C063',
              ringBorder: d === a ? '#0E7C5A' : 'rgba(255,255,255,.28)',
              ringBg: d === a ? '#0E7C5A' : 'transparent',
              markShow: d === a ? 'block' : 'none'
            },
            {
              label: 'Réussir l\'examen ' + lv.eyebrow + ' à 75%',
              val: d === a ? 'Disponible' : 'À venir',
              valInk: d === a ? '#E3C063' : 'rgba(255,255,255,.4)',
              ringBorder: 'rgba(255,255,255,.28)', ringBg: 'transparent', markShow: 'none'
            }
          ],
          open: function () {
            if (d === a) self.toast('Examen ' + lv.eyebrow + ' · module porté à la prochaine étape');
            else self.toast('Encore ' + (a - d) + ' leçons avant l\'examen');
          }
        };
      }
      return {
        eyebrow: lv.eyebrow, title: lv.title, desc: lv.desc,
        nextStep: nextStep, nextShow: !!nextStep,
        pct: Math.round(d / a * 100) + '%',
        opacity: locked ? '.55' : '1',
        lockShow: locked ? 'block' : 'none',
        badgeBg: locked ? '#EFEDE6' : '#E6F1EB', badgeInk: locked ? '#8A8578' : '#0B6349',
        modules: lv.modules.map(function (m, ix) {
          var t = self.tint(m.cat);
          var nf = INFO[m.name];
          var pct = Math.round(nf.done / nf.total * 100);
          var status = nf.done === 0 ? 'Nouveau' : (nf.done === nf.total ? 'Terminé' : nf.done + '/' + nf.total);
          return {
            name: m.name, meta: nf.src + ' · ' + nf.total + ' leçons · ' + nf.dur,
            bg: t.bg, ink: t.ink, d: self.IC[m.ic][0], d2: self.IC[m.ic][1],
            pct: pct + '%', fill: nf.done === nf.total ? '#0E7C5A' : '#B08D4F',
            status: status,
            statusInk: nf.done === nf.total ? '#0E7C5A' : (nf.done === 0 ? '#B6B1A5' : '#8A5E1F'),
            divider: ix === last ? 'none' : '1px solid #EFEDE6',
            open: function () {
              if (locked) { self.toast('Termine le niveau 1 pour débloquer'); return; }
              self.setState({ course: m.name, ctab: 'audio', noteDraft: st.cnotes[m.name] || '' });
            }
          };
        })
      };
    });

    var badges = this.BADGES.map(function (b) {
      return {
        name: b.name, d: self.IC[b.ic][0], d2: self.IC[b.ic][1],
        bg: b.on ? '#F7EFDD' : '#EFEDE6', ink: b.on ? '#B08D4F' : '#B6B1A5',
        border: b.on ? '#EADFC4' : '#E4E1D8', opacity: b.on ? '1' : '.6',
        show: function () { self.toast(b.on ? b.name + ' · débloqué' : b.name + ' · encore verrouillé'); }
      };
    });

    // ── lecteur audio global ──
    var pl = st.player;
    var mini = null;
    if (pl) {
      var pc = this.courseOf(pl.course);
      var pLes = pc.lessons[pl.idx];
      mini = {
        title: pLes ? pLes.t : '',
        course: pl.course,
        pct: Math.round(pl.pos / pl.dur * 100) + '%',
        pos: this.mmss(pl.pos), dur: this.mmss(pl.dur),
        playing: pl.playing,
        playD: pl.playing ? 'M8.5 6h3v12h-3zM14 6h3v12h-3z' : 'M7.5 5v14l11-7z',
        rateLabel: pl.rate === 1 ? '1×' : (pl.rate === 1.5 ? '1,5×' : '2×'),
        toggle: function () {
          var np = Object.assign({}, pl, { playing: !pl.playing });
          self.setState({ player: np });
          if (np.playing) self.tickPlayer();
          else if (self._pl) { clearInterval(self._pl); self._pl = null; }
        },
        cycleRate: function () {
          var r = pl.rate === 1 ? 1.5 : (pl.rate === 1.5 ? 2 : 1);
          self.setState({ player: Object.assign({}, pl, { rate: r }) });
        },
        back: function () { self.setState({ player: Object.assign({}, pl, { pos: Math.max(0, pl.pos - 15) }) }); },
        openCourse: function () { self.setState({ playerFull: true }); },
        close: function () {
          if (self._pl) { clearInterval(self._pl); self._pl = null; }
          self.setState({ player: null, playerFull: false });
        }
      };
    }

    // ── lecteur plein écran ──
    var plFull = null;
    if (pl && st.playerFull) {
      var pfc = this.courseOf(pl.course);
      var pfLes = pfc.lessons[pl.idx];
      var pfHasPrev = pl.idx > 0;
      var pfHasNext = pl.idx < pfc.lessons.length - 1;
      plFull = {
        courseTitle: pl.course,
        lessonTitle: pfLes ? pfLes.t : '',
        lessonMeta: 'Leçon ' + (pl.idx + 1) + ' / ' + pfc.lessons.length,
        pos: this.mmss(pl.pos), dur: this.mmss(pl.dur),
        left: '-' + this.mmss(Math.max(0, pl.dur - pl.pos)),
        pct: Math.round(pl.pos / pl.dur * 100) + '%',
        playing: pl.playing,
        coverShadow: pl.playing ? '0 20px 50px -18px rgba(14,124,90,.55)' : '0 14px 34px -18px rgba(0,0,0,.6)',
        coverScale: pl.playing ? 'scale(1)' : 'scale(.94)',
        playD: pl.playing ? 'M8.5 6h3v12h-3zM14 6h3v12h-3z' : 'M7.5 5v14l11-7z',
        rateLabel: pl.rate === 1 ? '1×' : (pl.rate === 1.5 ? '1,5×' : '2×'),
        prevDisabled: !pfHasPrev, nextDisabled: !pfHasNext,
        prevOpacity: pfHasPrev ? '1' : '.3', nextOpacity: pfHasNext ? '1' : '.3',
        minimize: function () { self.setState({ playerFull: false }); },
        openCourse: function () { self.setState({ playerFull: false, screen: 'learn', course: pl.course, ctab: 'audio', noteDraft: st.cnotes[pl.course] || '' }); },
        toggle: function () {
          var np = Object.assign({}, pl, { playing: !pl.playing });
          self.setState({ player: np });
          if (np.playing) self.tickPlayer();
          else if (self._pl) { clearInterval(self._pl); self._pl = null; }
        },
        back: function () { self.setState({ player: Object.assign({}, pl, { pos: Math.max(0, pl.pos - 15) }) }); },
        fwd: function () { self.setState({ player: Object.assign({}, pl, { pos: Math.min(pl.dur, pl.pos + 15) }) }); },
        prev: function () { if (pfHasPrev) self.playLesson(pl.course, pl.idx - 1); },
        next: function () { if (pfHasNext) self.playLesson(pl.course, pl.idx + 1); },
        cycleRate: function () {
          var r = pl.rate === 1 ? 1.5 : (pl.rate === 1.5 ? 2 : 1);
          self.setState({ player: Object.assign({}, pl, { rate: r }) });
        },
        close: function () {
          if (self._pl) { clearInterval(self._pl); self._pl = null; }
          self.setState({ player: null, playerFull: false });
        },
        seekTrack: function (e) {
          var rect = e.currentTarget.getBoundingClientRect();
          var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
          var ratio = Math.max(0, Math.min(1, x / rect.width));
          self.setState({ player: Object.assign({}, pl, { pos: Math.round(pl.dur * ratio) }) });
        },
        addNote: function () {
